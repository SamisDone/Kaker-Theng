# One command for local development:  docker compose up
#   website  http://localhost:3000
#   API      http://localhost:8000
services:
  backend:
    build: ./backend
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    mem_limit: 512m # same as the free server, to catch memory problems early

  frontend:
    # Next.js runs on Node; Bun installs packages and runs the scripts.
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install -g bun@1.3.12 --silent && bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_modules:
