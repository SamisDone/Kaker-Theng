<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="190 460 1000 1000">
<style>
path{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .5s cubic-bezier(.45,.05,.35,1) forwards}
path:nth-child(2){animation-delay:.35s}path:nth-child(3){animation-delay:.7s}path:nth-child(4){animation-delay:1.05s}
path:nth-child(5){animation-delay:1.4s}path:nth-child(6){animation-delay:1.55s}path:nth-child(7){animation-delay:1.7s}
path:nth-child(8){animation-delay:1.95s;animation-duration:.7s}
circle{opacity:0;animation:fade .3s ease-out 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){path,circle{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
