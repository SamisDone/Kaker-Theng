# Render Blueprint: one free web service, built from the root Dockerfile,
# serving the website at / and the API under /api from the same address.
# Render > New > Blueprint > pick this repo (README, "Deploy").
services:
  - type: web
    # Kept from the earlier API-only setup: renaming it would make Render
    # create a second service next to the existing one.
    name: kaker-theng-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - backend/**
        - frontend/**
    envVars:
      # How many uploads may wait in line before people are asked to retry.
      - key: MAX_QUEUE
        value: "5"
